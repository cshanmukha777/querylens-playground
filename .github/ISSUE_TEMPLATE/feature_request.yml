name: Feature request
description: Suggest a focused improvement to the Playground.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem to solve
      description: What developer task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
